<style>

@media(orientation:landscape){#top{min-height:48px}.stat{font-size:11px;padding:3px 7px}#bottom{padding-top:4px;padding-bottom:4px}.action{padding:3px;font-size:10px;flex-direction:row;justify-content:center}.action small{display:none}#panel{inset:8% 20%}}

</style></head>
<body><div id="game">
<header id="top"><div class="brand">FAZENDA FELIZ</div><div class="stats"><div class="stat">NV <b id="level">1</b></div><div class="stat">MOEDAS <b id="coins">250</b></div><div class="stat">ENERGIA <b id="energy">30</b></div><div class="stat">XP <b id="xp">0</b></div></div></header>

<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const names=['lake','house','barn','silo','windmill','well','market','tractor','cow','pig','sheep','chicken','dog','pen','empty_plot','wheat_1','wheat_2','wheat_3','corn_1','corn_2','corn_3','carrot_1','carrot_2','carrot_3','strawberry_1','strawberry_2','strawberry_3','lettuce_1','lettuce_2','lettuce_3','apple_tree','flower_bush','pine_tree','willow_tree','gate','cart','crate','barrel'];
const img={};names.forEach(n=>{img[n]=new Image();img[n].src='images/'+n+'.png'});
const W=1536,H=1024;let scale=1,camX=0,camY=0,viewW=0,viewH=0,last=0,selectedCrop='wheat',coins=250,energy=30,xp=0,level=1,land=1,animalProducts={cow:0,pig:0,sheep:0,chicken:0},dailyStamp='',tractorUntil=0;
const WX0=-700,WX1=2300,WY0=-160,WY1=1460;let FX=700,FY=625;const HX=52,HY=30;let fieldN=4;let plots=[];let zonesOwned=[];
const ZONES=[{id:'ne',x:1790,y:330,n:5,cost:500,lv:2,nome:'Terreno do Leste'},{id:'nw',x:-150,y:290,n:5,cost:1000,lv:3,nome:'Terreno do Oeste'},{id:'se',x:1720,y:910,n:5,cost:2000,lv:4,nome:'Terreno do Sul'},{id:'sw',x:-140,y:960,n:5,cost:3500,lv:5,nome:'Terreno da Várzea'}];
function fieldSize(l){return Math.min(5,3+l)}
function fields(){let f=[{id:'main',x:FX,y:FY,n:fieldN}];ZONES.forEach(z=>{if(zonesOwned.includes(z.id))f.push(z)});return f}
function cellCenterF(F,i,j){return{x:F.x+(i-j)*HX,y:F.y-F.n*HY+(i+j+1)*HY}}
function cellCenter(i,j){return cellCenterF({x:FX,y:FY,n:fieldN},i,j)}
function buildField(old){fieldN=fieldSize(land);let np=[];fields().forEach(F=>{for(let i=0;i<F.n;i++)for(let j=0;j<F.n;j++){let c=cellCenterF(F,i,j);np.push({f:F.id,i,j,x:c.x,y:c.y,crop:null,stage:0,planted:0,readyAt:0,id:np.length})}});
 (old||[]).forEach((p,k)=>{if(!p||!p.crop)return;let fid=p.f||'main',t=np.find(q=>q.f===fid&&q.i===p.i&&q.j===p.j);if(!t&&!p.f)t=np[k];if(t){t.crop=p.crop;t.planted=p.planted;t.readyAt=p.readyAt}});plots=np}
function cellAt(x,y){for(const F of fields()){let u=(x-F.x)/HX,v=(y-(F.y-F.n*HY))/HY,i=Math.floor((v+u)/2),j=Math.floor((v-u)/2);if(i>=0&&j>=0&&i<F.n&&j<F.n)return plots.find(p=>p.f===F.id&&p.i===i&&p.j===j)}return null}
function zoneAt(x,y){return ZONES.find(z=>!zonesOwned.includes(z.id)&&Math.abs(x-z.x)/(z.n*HX)+Math.abs(y-z.y)/(z.n*HY)<=1)}
buildField();
let animals=[{type:'cow',x:0,y:0,start:1,dx:1,dy:0.2,product:'Leite'},{type:'pig',x:0,y:0,start:1,dx:-.6,dy:.5,product:''},{type:'sheep',x:0,y:0,start:1,dx:.3,dy:-.7,product:'Lã'},{type:'chicken',x:0,y:0,start:1,dx:.8,dy:-.3,product:'Ovos'},{type:'dog',x:960,y:610,dx:-.5,dy:-.2,product:''}];
function load(){try{let s=JSON.parse(localStorage.getItem('fazendaFelizSave')||'null');if(s){coins=s.coins??coins;energy=s.energy??energy;xp=s.xp??xp;level=s.level??level;land=s.land??land;zonesOwned=s.zonesOwned||[];applyLayout(s.lay);buildField(s.plots||[]);animalProducts=s.animalProducts??animalProducts;dailyStamp=s.dailyStamp??'';tractorUntil=0;energyTs=s.energyTs??Date.now()}}catch(e){}}
let energyTs=Date.now();
function save(){localStorage.setItem('fazendaFelizSave',JSON.stringify({coins,energy,xp,level,land,zonesOwned,lay:layout(),plots,animalProducts,dailyStamp,energyTs}))}
function regen(){let n=Math.floor((Date.now()-energyTs)/60000);if(n>0){if(energy<30)energy=Math.min(30,energy+n);energyTs+=n*60000;updateHud()}if(energy>=30)energyTs=Date.now()}
function resize(){let r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);viewW=r.width;viewH=r.height;minS=Math.min(viewW/(WX1-WX0),viewH/(WY1-WY0));scale=viewH>viewW?Math.max(minS,viewW*1.7/W,viewH*.78/H):Math.max(viewW/W,viewH/H);camX=(viewH>viewW?850:W/2)-viewW/scale/2;camY=(viewH>viewW?560:H/2)-viewH/scale/2;clampCam();worldDraw(performance.now())}

/* terra em volta da fazenda, com árvores e áreas à venda */
const inIsland=(x,y)=>Math.abs(x-800)/1080+Math.abs(y-640)/640<1;
const DECOR=(()=>{let r=7,rnd=()=>(r=(r*16807)%2147483647)/2147483647,out=[],kinds=['pine_tree','apple_tree','willow_tree','flower_bush','pine_tree','flower_bush'];
 for(let n=0;n<1500&&out.length<90;n++){let x=WX0+rnd()*(WX1-WX0),y=WY0+60+rnd()*(WY1-WY0-60);if(inIsland(x,y+40)||inIsland(x,y-60))continue;
  if(ZONES.some(z=>Math.abs(x-z.x)/(z.n*HX+40)+Math.abs(y-z.y)/(z.n*HY+60)<1.05))continue;if(out.some(o=>Math.hypot(o.x-x,o.y-y)<90))continue;if(Math.abs(x-1330)<190&&Math.abs(y-930)<150)continue;
  let k=kinds[Math.floor(rnd()*kinds.length)];out.push({x,y,k,s:.8+rnd()*.5})}return out.sort((a,b)=>a.y-b.y)})();
const DSZ={pine_tree:[70,66],apple_tree:[190,110],willow_tree:[70,117],flower_bush:[90,40]};
let GROUND=null;const GS=.6;
function buildGround(){const c=document.createElement('canvas'),w=Math.ceil((WX1-WX0+800)*GS),h=Math.ceil((WY1-WY0+800)*GS);c.width=w;c.height=h;const g=c.getContext('2d');g.scale(GS,GS);g.translate(-(WX0-400),-(WY0-400));
 g.fillStyle='#7fc24f';g.fillRect(WX0-400,WY0-400,WX1-WX0+800,WY1-WY0+800);
 const P=(i,j)=>[(i-j)*HX*2,(i+j)*HY*2];
 for(let i=-40;i<60;i++)for(let j=-50;j<40;j++){let[x,y]=P(i,j);if(x<WX0-500||x>WX1+500||y<WY0-500||y>WY1+500)continue;
  g.fillStyle=(i+j)%2?'#86c955':'#7dbf4c';g.beginPath();g.moveTo(x,y);g.lineTo(x+HX*2,y+HY*2);g.lineTo(x,y+HY*4);g.lineTo(x-HX*2,y+HY*2);g.closePath();g.fill()}
 let gr=g.createRadialGradient(800,640,200,800,640,1500);gr.addColorStop(0,'rgba(255,255,200,.10)');gr.addColorStop(1,'rgba(20,60,10,.18)');g.fillStyle=gr;g.fillRect(WX0-400,WY0-400,WX1-WX0+800,WY1-WY0+800);
 let r=11,rnd=()=>(r=(r*16807)%2147483647)/2147483647;
 for(let k=0;k<5200;k++){let x=WX0-300+rnd()*(WX1-WX0+600),y=WY0-300+rnd()*(WY1-WY0+600),c=rnd();
  if(c<.82){g.strokeStyle=rnd()<.5?'#5ea33a':'#9ad866';g.lineWidth=2;g.beginPath();g.moveTo(x-4,y);g.lineTo(x-1,y-8);g.moveTo(x,y);g.lineTo(x+1,y-10);g.moveTo(x+4,y);g.lineTo(x+2,y-7);g.stroke()}
  else{g.fillStyle=['#fff','#ffe066','#ff9ec7','#c9a7ff'][Math.floor(rnd()*4)];g.beginPath();g.arc(x,y,2.6,0,7);g.fill();g.fillStyle='#ffd34d';g.beginPath();g.arc(x,y,1,0,7);g.fill()}}
 GROUND=c}
function drawOuter(t,front){
 if(!front){if(!GROUND)buildGround();ctx.drawImage(GROUND,WX0-400,WY0-400,GROUND.width/GS,GROUND.height/GS);ZONES.forEach(z=>drawZone(z,t))}
 DECOR.forEach(d=>{let [w,h]=DSZ[d.k];drawSprite(d.k,d.x,d.y,w*d.s,h*d.s)})}
function drawZone(z,t){if(zonesOwned.includes(z.id))return;let n=z.n,P=(a,b)=>[z.x+(a-b)*HX,z.y-n*HY+(a+b)*HY];
 const pl=(pts,f)=>{ctx.beginPath();pts.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill()};
 pl([P(0,0),P(n,0),P(n,n),P(0,n)],'rgba(70,120,40,.35)');
 ctx.save();ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=4;ctx.beginPath();[P(0,0),P(n,0),P(n,n),P(0,n)].forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();ctx.restore();
 [[.25,.3],[.7,.2],[.4,.75],[.8,.7],[.5,.45]].forEach(([a,b],k)=>{let q=P(a*n,b*n);drawSprite(k%2?'flower_bush':'pine_tree',q[0],q[1]+10,k%2?60:48,k%2?27:45)});
 let ok=level>=z.lv,txt=ok?'🔒 '+z.cost+' moedas':'🔒 Nível '+z.lv;ctx.save();ctx.font='900 22px sans-serif';ctx.textAlign='center';let tw=ctx.measureText(txt).width+34,bob=Math.sin(t/400)*3;
 ctx.fillStyle=ok?'#e79a24':'rgba(70,45,20,.85)';ctx.beginPath();ctx.roundRect(z.x-tw/2,z.y-22+bob,tw,40,20);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(txt,z.x,z.y+7+bob);
 ctx.font='bold 15px sans-serif';ctx.fillStyle='rgba(60,40,15,.85)';ctx.fillText(z.nome,z.x,z.y+40+bob);ctx.restore()}
function buyZone(z){if(level<z.lv){toast('Chegue ao nível '+z.lv+' para comprar este terreno');return}if(coins<z.cost){toast('Faltam '+(z.cost-coins)+' moedas para este terreno');return}
 coins-=z.cost;zonesOwned.push(z.id);buildField(plots);gainXP(50);updateHud();save();closePanels&&closePanels();toast(z.nome+' comprado! Nova plantação com '+z.n*z.n+' canteiros 🎉');if(window.SND)SND.play('level')}
function askZone(z){openPanel(z.nome,'<p>Uma nova plantação com <b>'+z.n*z.n+' canteiros</b> para você plantar.</p><p>Preço: <b>'+z.cost+' moedas</b> · precisa do nível '+z.lv+'.</p><button class="panelbtn" onclick="buyZone(ZONES.find(z=>z.id===\''+z.id+'\'))">Comprar terreno</button>')}
function goTo(x,y){camX=x-viewW/scale/2;camY=y-viewH/scale/2;clampCam()}
function drawSprite(key,x,y,w,h){let im=img[key];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x-w/2,y-h,w,h)}
function worldDraw(t){ctx.clearRect(0,0,viewW,viewH);ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);
drawOuter(t,0);
// Buildings are separate PNG objects layered over the illustrated terrain.
Object.values(OBJ).filter(o=>o.k!=='tractor').sort((a,b)=>((b.flat||0)-(a.flat||0))||(a.y-b.y)).forEach(o=>{drawSprite(o.k,o.x,o.y,o.w,o.h);if(moving&&moving.o===o)drawFoot(moving)});
// Extra farm details
if(land>1)drawSprite('apple_tree',410,470,150,170);
// Garden plots and crop stages
{const poly=(pts,f)=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill()};
 fields().forEach(F=>{let n=F.n,ty=F.y-n*HY,P=(a,b)=>[F.x+(a-b)*HX,ty+(a+b)*HY];
 poly([P(0,0),P(n,0),P(n,n),P(0,n)],'#7a4b26');
 poly([P(n,0),P(n,n),[P(n,n)[0],P(n,n)[1]+10],[P(n,0)[0],P(n,0)[1]+10]],'#5b3519');poly([P(0,n),P(n,n),[P(n,n)[0],P(n,n)[1]+10],[P(0,n)[0],P(0,n)[1]+10]],'#6b3f1e');
 plots.forEach(p=>{if(p.f!==F.id)return;let a=p.i,b=p.j,dry=!p.crop;poly([P(a+.06,b+.06),P(a+.94,b+.06),P(a+.94,b+.94),P(a+.06,b+.94)],dry?'#8f5c30':'#6e4322');
  ctx.strokeStyle='rgba(60,32,12,.45)';ctx.lineWidth=2;for(let r=1;r<4;r++){let q1=P(a+.12,b+r*.25),q2=P(a+.88,b+r*.25);ctx.beginPath();ctx.moveTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.stroke()}});
 ctx.strokeStyle='#c98a4a';ctx.lineWidth=5;ctx.beginPath();[P(0,0),P(n,0),P(n,n),P(0,n)].forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke()});
 let trDone=!TR;const trDraw=()=>{if(!trDone){drawTractorAt(TR.x,TR.y,90,80,TR.face);trDone=true}};[...plots].sort((p,q)=>p.y-q.y).forEach(p=>{if(!trDone&&TR.y<p.y+6)trDraw();if(!p.crop)return;let f=(Date.now()-p.planted)/Math.max(1,p.readyAt-p.planted);let st=f>=1?3:f>=.45?2:1;p.stage=st;let sz=st===1?.6:st===2?.8:1;
  let im=img[p.crop+'_'+st];if(im&&im.naturalWidth){let w=72*sz,h=w*im.naturalHeight/im.naturalWidth;let bob=st===3?Math.sin(t/300+p.id)*1.5:0;ctx.drawImage(im,p.x-w/2,p.y+12-h+bob,w,h)}
  if(st===3){ctx.save();ctx.globalAlpha=.5+.4*Math.sin(t/220+p.id);ctx.fillStyle='#fff7b0';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('✦',p.x+16,p.y-28);ctx.restore()}
  else{let bw=38;ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(p.x-bw/2,p.y+14,bw,5);ctx.fillStyle='#ffd34d';ctx.fillRect(p.x-bw/2,p.y+14,bw*Math.min(1,f),5)}});
 trDraw();floaters=floaters.filter(fl=>(fl.t+=0.016)<1.2);floaters.forEach(fl=>{ctx.save();ctx.globalAlpha=1-fl.t/1.2;ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.fillStyle=fl.neg?'#b3261e':'#2e7d32';ctx.strokeText(fl.txt,fl.x,fl.y-fl.t*40);ctx.fillText(fl.txt,fl.x,fl.y-fl.t*40);ctx.restore()})}
// Pen and wandering animals; animals turn in their travel direction.
if(moving&&moving.kind==='field')drawFoot(moving);drawPens(t);
[...animals].sort((p,q)=>p.y-q.y).forEach(a=>{let im=img[a.type];if(!im?.complete||!im.naturalWidth)return;let w=SZ[a.type]||80,h=w*im.naturalHeight/im.naturalWidth;ctx.save();ctx.translate(a.x,a.y);ctx.fillStyle='rgba(60,35,10,.25)';ctx.beginPath();ctx.ellipse(0,-3,w*.36,w*.1,0,0,7);ctx.fill();let step=a.pause>0?0:Math.abs(Math.sin(t/140+a.x))*-4;ctx.rotate(a.pause>0?0:Math.sin(t/140+a.x)*.04);ctx.scale(a.dx<0?-1:1,1);ctx.drawImage(im,-w/2,-h+step,w,h);ctx.restore()});
{let T=OBJ.tractor;if(TR){}else{drawSprite('tractor',T.x,T.y,T.w,T.h);if(moving&&moving.o===T)drawFoot(moving)}}
drawBubbles(t);ctx.restore();}
const SZ={cow:100,pig:80,sheep:78,chicken:48,dog:72};

canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),ns=Math.max(minS,Math.min(2.2,pinch.scale*d/pinch.dist));let mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,r=canvas.getBoundingClientRect();let wx=(pinch.midX-r.left)/scale+camX,wy=(pinch.midY-r.top)/scale+camY;scale=ns;camX=wx-(mx-r.left)/scale;camY=wy-(my-r.top)/scale;clampCam();return}if(drag&&drag.id===e.pointerId&&drag.paint){let w=toWorld(e.clientX,e.clientY),c=cellAt(w.x,w.y);if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>6){if(!drag.moved){drag.moved=true;plantAt(drag.first,true)}if(c&&!drag.paint.has(c.id)){drag.paint.add(c.id);plantAt(c,true)}}return}if(drag&&drag.id===e.pointerId){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;camX=drag.camX-dx/scale;camY=drag.camY-dy/scale;clampCam()}});
function clampCam(){let ww=WX1-WX0,wh=WY1-WY0;if(ww*scale<=viewW)camX=WX0+(ww-viewW/scale)/2;else camX=Math.max(WX0,Math.min(WX1-viewW/scale,camX));if(wh*scale<=viewH)camY=WY0+(wh-viewH/scale)/2;else camY=Math.max(WY0,Math.min(WY1-viewH/scale,camY))}
function zoomBy(f){let cx=camX+viewW/scale/2,cy=camY+viewH/scale/2;scale=Math.max(minS,Math.min(2.2,scale*f));camX=cx-viewW/scale/2;camY=cy-viewH/scale/2;clampCam()}
function zoomReset(){resize()}
canvas.addEventListener('pointerup',e=>{let p=pointers.get(e.pointerId);if(pointers.size===1&&drag&&!drag.moved){let w=toWorld(e.clientX,e.clientY);if(!hit(w.x,w.y)){} }pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(pointers.size===0)drag=null});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=null});
let TR=null;const CROPV={wheat:18,corn:24,carrot:30,strawberry:38,lettuce:32};
function useTractor(){if(TR){toast('O trator já está trabalhando');return}let ready=plots.filter(p=>p.crop&&Date.now()>=p.readyAt);if(!ready.length){toast('Ainda não há plantações prontas');return}if(energy<2){toast('O trator precisa de 2 energias');return}energy-=2;updateHud();
 ready.sort((a,b)=>(a.f>b.f?1:a.f<b.f?-1:0)||(a.i-b.i)||((a.i%2?-1:1)*(a.j-b.j)));
 let T=OBJ.tractor,path=ready.map(p=>({x:p.x,y:p.y+6,p}));path.push({x:T.x,y:T.y,home:1});TR={x:T.x,y:T.y,path,k:0,n:0,face:1};tractorUntil=Date.now()+600000;save()}
function stepTractor(dt){if(!TR)return;let g=TR.path[TR.k],dx=g.x-TR.x,dy=g.y-TR.y,d=Math.hypot(dx,dy),sp=g.home?260:150;
 if(Math.abs(dx)>1)TR.face=dx<0?-1:1;
 if(d<=sp*dt){TR.x=g.x;TR.y=g.y;if(g.p&&g.p.crop){let v=CROPV[g.p.crop]||20;coins+=v;floaters.push({x:g.p.x,y:g.p.y-30,txt:'+'+v,t:0});g.p.crop=null;TR.n++;gainXP(10);updateHud();if(window.SND)SND.play('coin')}
  TR.k++;if(TR.k>=TR.path.length){toast('🚜 Trator colheu '+TR.n+' canteiro'+(TR.n>1?'s':'')+'!');TR=null;tractorUntil=0;save()}}
 else{TR.x+=dx/d*sp*dt;TR.y+=dy/d*sp*dt}}
function drawTractorAt(x,y,w,h,face){let im=img.tractor;if(!im||!im.naturalWidth)return;ctx.save();ctx.translate(x,y);ctx.scale(face,1);ctx.translate(0,Math.sin(performance.now()/60)*1.2);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}

 let main=fieldN<5?'<div class="mission"><b>Aumentar a plantação principal</b><p>De '+fieldN+'×'+fieldN+' para 5×5 canteiros · 300 moedas</p><button class="panelbtn" onclick="growMain()">Aumentar</button></div>':'';

/* ===== Sons e música (gerados no próprio jogo, sem arquivos) ===== */
const SND=(()=>{let ac=null,master,musicGain,sfxGain,on=true,started=false,musicTimer=null,step=0;
 try{on=localStorage.getItem('ffSom')!=='0'}catch(e){}
 function init(){if(ac)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();master=ac.createGain();master.gain.value=on?1:0;master.connect(ac.destination);
  musicGain=ac.createGain();musicGain.gain.value=.16;musicGain.connect(master);sfxGain=ac.createGain();sfxGain.gain.value=.55;sfxGain.connect(master)}
 function tone(f,t0,dur,type='triangle',vol=.5,out=sfxGain,slide=0,vib=0){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+dur);
  if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=vib;lg.gain.value=f*.04;l.connect(lg);lg.connect(o.frequency);l.start(t0);l.stop(t0+dur)}
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+dur+.05)}
 function noise(t0,dur,vol=.3,freq=800,q=1){const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);n.connect(f);f.connect(g);g.connect(sfxGain);n.start(t0)}
 /* música: valsinha alegre de fazenda em Dó maior */
 const MEL=[72,0,76,79,0,76,74,0,77,81,0,77,76,0,79,84,0,79,77,76,74,72,0,0, 72,0,76,79,0,76,74,0,77,81,0,77,79,77,76,74,0,71,72,0,0,0,0,0];
 const BAS=[48,55,52,55,53,57,53,57,48,55,52,55,43,50,47,50];
 const mf=n=>440*Math.pow(2,(n-69)/12);
 function musicTick(){if(!ac)return;const t=ac.currentTime+.05,sp=.19;const n=MEL[step%MEL.length];if(n)tone(mf(n),t,sp*1.6,'triangle',.5,musicGain);
  if(step%3===0){const b=BAS[Math.floor(step/3)%BAS.length];tone(mf(b),t,sp*2.6,'sine',.6,musicGain)}if(step%3===1||step%3===2){const b=BAS[Math.floor(step/3)%BAS.length];tone(mf(b+12),t,sp*.7,'triangle',.18,musicGain)}step++}
 function startMusic(){if(musicTimer)return;musicTimer=setInterval(musicTick,190)}
 const S={
  start(){init();if(!ac)return;if(ac.state==='suspended')ac.resume();if(!started){started=true;startMusic()}},
  toggle(){on=!on;try{localStorage.setItem('ffSom',on?'1':'0')}catch(e){}if(master)master.gain.value=on?1:0;return on},
  isOn:()=>on,
  play(name){if(!ac||!on)return;const t=ac.currentTime;
   if(name==='click')tone(880,t,.06,'sine',.25);
   if(name==='plant'){noise(t,.12,.25,600,2);tone(330,t+.02,.12,'sine',.35,sfxGain,1.6)}
   if(name==='harvest'){[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.06,.18,'square',.12));noise(t,.15,.15,3000,1)}
   if(name==='coin'){tone(988,t,.08,'square',.15);tone(1319,t+.07,.25,'square',.15)}
   if(name==='error')tone(220,t,.2,'sawtooth',.15,sfxGain,.7);
   if(name==='level'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,t+i*.11,i===5?.6:.15,'square',.14))}
   if(name==='gift'){[659,784,988,1319].forEach((f,i)=>tone(f,t+i*.08,.3,'triangle',.3))}
   if(name==='cow'){tone(150,t,1.1,'sawtooth',.28,sfxGain,.75,5)}
   if(name==='pig'){[0,.16].forEach(d=>{tone(260,t+d,.13,'square',.18,sfxGain,.6);noise(t+d,.12,.18,500,3)})}
   if(name==='sheep'){const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(360,t+.8);l.frequency.value=14;lg.gain.value=.12;l.connect(lg);lg.connect(g.gain);g.gain.setValueAtTime(.15,t);g.gain.linearRampToValueAtTime(0,t+.85);o.connect(g);g.connect(sfxGain);o.start(t);l.start(t);o.stop(t+.9);l.stop(t+.9)}
   if(name==='chicken'){[0,.1,.2,.42].forEach((d,i)=>tone(i===3?1100:700+i*60,t+d,i===3?.25:.07,'square',.12,sfxGain,i===3?.8:1.3))}
   if(name==='dog'){[0,.25].forEach(d=>{tone(330,t+d,.14,'sawtooth',.25,sfxGain,.5);noise(t+d,.1,.2,900,2)})}
   if(name==='tractor'){for(let i=0;i<18;i++)noise(t+i*.09,.09,.22,140,4);tone(70,t,1.7,'sawtooth',.18,sfxGain,1.2)}
  }};return S})();

(function(){
 const _plant=plantAt;plantAt=function(p,quiet){const had=p.crop,c0=coins;_plant(p,quiet);if(had&&!p.crop)SND.play('harvest');else if(!had&&p.crop)SND.play('plant');else if(c0===coins&&!quiet)SND.play('error')};
 const _col=collectAnimal;collectAnimal=function(a){SND.play(a.type);const c0=coins;_col(a);if(coins>c0)setTimeout(()=>SND.play('coin'),350)};
 const _xp=gainXP;gainXP=function(n){const l0=level;_xp(n);if(level>l0)SND.play('level')};

 const _gift=dailyGift;dailyGift=function(){const c0=coins;_gift();if(coins>c0)SND.play('gift')};
 document.addEventListener('click',e=>{if(e.target.closest('button'))SND.play('click')},true);

 const lab=()=>b.textContent=SND.isOn()?'🔊':'🔇';lab();b.onclick=e=>{e.stopPropagation();SND.start();SND.toggle();lab()};document.body.appendChild(b);
})();
