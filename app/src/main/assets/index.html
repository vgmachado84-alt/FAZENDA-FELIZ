<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fazenda Feliz</title>
<style>
:root{--green:#3b9d46;--deep:#236b35;--gold:#ffca3a;--cream:#fff7df;--brown:#8b542b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7fbd52;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;color:#fff}
#game{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#8bd8f4,#a9db72)}
#top{z-index:5;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:env(safe-area-inset-top) 8px 7px;background:linear-gradient(#2f9145,#216c38);box-shadow:0 3px 7px #174b3488;min-height:58px}
.brand{font-weight:1000;font-size:clamp(14px,3.4vw,21px);color:#fff4b0;text-shadow:1px 2px #70451d;white-space:nowrap}.stats{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.stat{background:#164f31;border:1px solid #9cdb75;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}.stat b{color:#ffe37b}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#9ddc6a}canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff9;border:1px solid #fff;border-radius:20px;padding:5px 12px;color:#315b30;font-size:11px;font-weight:800;pointer-events:none;white-space:nowrap;text-shadow:none}
#bottom{z-index:5;background:linear-gradient(#fff4d3,#e6c68c);padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:space-around;box-shadow:0 -3px 8px #63401b55}
.action{border:2px solid #b87932;border-radius:14px;background:linear-gradient(#fff,#f6d99b);color:#603c1c;min-width:0;flex:1;padding:6px 3px;font-weight:900;font-size:11px;box-shadow:0 3px #a86a2a;display:flex;flex-direction:column;align-items:center;gap:2px}
.action:active{transform:translateY(2px);box-shadow:0 1px #a86a2a}.action small{font-size:9px;font-weight:700;color:#76502b}.action.selected{background:linear-gradient(#fff6a9,#ffcf4a);border-color:#e39b19}
#toast{position:absolute;z-index:20;left:50%;bottom:90px;transform:translateX(-50%);background:#254d2b;color:white;padding:9px 16px;border-radius:20px;font-weight:800;font-size:13px;box-shadow:0 3px 10px #0005;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#panel{position:absolute;z-index:15;inset:12% 6% 12%;background:linear-gradient(#fff9e8,#f0d49c);border:4px solid #a86a2a;border-radius:22px;box-shadow:0 10px 40px #173b2788;color:#57371c;display:none;overflow:auto;padding:15px}#panel h2{margin:0 0 10px;color:#367b3c}#panel p{font-size:13px}#panel .close{float:right;border:0;border-radius:50%;width:32px;height:32px;background:#b84a35;color:white;font-size:18px;font-weight:900} .shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.shopitem{background:#fff8e7;border:2px solid #d7a75f;border-radius:14px;padding:9px;text-align:center}.shopitem img{width:90px;height:70px;object-fit:contain}.shopitem strong{display:block}.shopitem button,.panelbtn{border:0;border-radius:12px;background:#3c9b4b;color:white;padding:8px 12px;font-weight:900;margin-top:5px}.mission{background:#fff8e7;border-radius:12px;padding:10px;margin:7px 0;border:1px solid #ddb36e}
@media(orientation:landscape){#top{min-height:48px}.stat{font-size:11px;padding:3px 7px}#bottom{padding-top:4px;padding-bottom:4px}.action{padding:3px;font-size:10px;flex-direction:row;justify-content:center}.action small{display:none}#panel{inset:8% 20%}}
</style></head>
<body><div id="game">
<header id="top"><div class="brand">FAZENDA FELIZ</div><div class="stats"><div class="stat">NÍVEL <b id="level">1</b></div><div class="stat">MOEDAS <b id="coins">250</b></div><div class="stat">ENERGIA <b id="energy">30</b></div><div class="stat">XP <b id="xp">0</b></div></div></header>
<main id="scene"><canvas id="world"></canvas><div id="hint">Arraste para explorar · toque nos canteiros e animais</div><div id="toast"></div><section id="panel"></section></main>
<nav id="bottom">
<button class="action selected" id="plantBtn" onclick="choosePlant('wheat')"><span>Plantar</span><small>Trigo</small></button>
<button class="action" onclick="openShop()">Loja<small>sementes</small></button>
<button class="action" onclick="useTractor()">Trator<small>colher tudo</small></button>
<button class="action" onclick="openMissions()">Missões<small>objetivos</small></button>
<button class="action" onclick="dailyGift()">Presente<small>diário</small></button>
<button class="action" onclick="expandLand()">Terreno<small>expandir</small></button>
</nav></div>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const names=['map','house','barn','silo','windmill','well','market','tractor','cow','pig','sheep','chicken','dog','pen','empty_plot','wheat_1','wheat_2','wheat_3','corn_1','corn_2','corn_3','carrot_1','carrot_2','carrot_3','strawberry_1','strawberry_2','strawberry_3','lettuce_1','lettuce_2','lettuce_3','apple_tree','flower_bush','pine_tree','willow_tree','gate','cart','crate','barrel'];
const img={};names.forEach(n=>{img[n]=new Image();img[n].src='images/'+n+'.png'});
const W=1536,H=1024;let scale=1,camX=0,camY=0,viewW=0,viewH=0,last=0,selectedCrop='wheat',coins=250,energy=30,xp=0,level=1,land=1,animalProducts={cow:0,pig:0,sheep:0,chicken:0},dailyStamp='',tractorUntil=0;
const WX0=-460,WX1=2080,WY0=-60,WY1=1320;const FX=700,FY=625,HX=52,HY=30;let fieldN=4;let plots=[];let zonesOwned=[];
const ZONES=[{id:'ne',x:1790,y:330,n:5,cost:500,lv:2,nome:'Terreno do Leste'},{id:'nw',x:-150,y:290,n:5,cost:1000,lv:3,nome:'Terreno do Oeste'},{id:'se',x:1720,y:910,n:5,cost:2000,lv:4,nome:'Terreno do Sul'},{id:'sw',x:-140,y:960,n:5,cost:3500,lv:5,nome:'Terreno da Várzea'}];
function fieldSize(l){return Math.min(5,3+l)}
function fields(){let f=[{id:'main',x:FX,y:FY,n:fieldN}];ZONES.forEach(z=>{if(zonesOwned.includes(z.id))f.push(z)});return f}
function cellCenterF(F,i,j){return{x:F.x+(i-j)*HX,y:F.y-F.n*HY+(i+j+1)*HY}}
function cellCenter(i,j){return cellCenterF({x:FX,y:FY,n:fieldN},i,j)}
function buildField(old){fieldN=fieldSize(land);let np=[];fields().forEach(F=>{for(let i=0;i<F.n;i++)for(let j=0;j<F.n;j++){let c=cellCenterF(F,i,j);np.push({f:F.id,i,j,x:c.x,y:c.y,crop:null,stage:0,planted:0,readyAt:0,id:np.length})}});
 (old||[]).forEach((p,k)=>{if(!p||!p.crop)return;let fid=p.f||'main',t=np.find(q=>q.f===fid&&q.i===p.i&&q.j===p.j);if(!t&&!p.f)t=np[k];if(t){t.crop=p.crop;t.planted=p.planted;t.readyAt=p.readyAt}});plots=np}
function cellAt(x,y){for(const F of fields()){let u=(x-F.x)/HX,v=(y-(F.y-F.n*HY))/HY,i=Math.floor((v+u)/2),j=Math.floor((v-u)/2);if(i>=0&&j>=0&&i<F.n&&j<F.n)return plots.find(p=>p.f===F.id&&p.i===i&&p.j===j)}return null}
function zoneAt(x,y){return ZONES.find(z=>!zonesOwned.includes(z.id)&&Math.abs(x-z.x)/(z.n*HX)+Math.abs(y-z.y)/(z.n*HY)<=1)}
buildField();
let animals=[{type:'cow',x:0,y:0,start:1,dx:1,dy:0.2,product:'Leite'},{type:'pig',x:0,y:0,start:1,dx:-.6,dy:.5,product:''},{type:'sheep',x:0,y:0,start:1,dx:.3,dy:-.7,product:'Lã'},{type:'chicken',x:0,y:0,start:1,dx:.8,dy:-.3,product:'Ovos'},{type:'dog',x:960,y:610,dx:-.5,dy:-.2,product:''}];
function load(){try{let s=JSON.parse(localStorage.getItem('fazendaFelizSave')||'null');if(s){coins=s.coins??coins;energy=s.energy??energy;xp=s.xp??xp;level=s.level??level;land=s.land??land;zonesOwned=s.zonesOwned||[];buildField(s.plots||[]);animalProducts=s.animalProducts??animalProducts;dailyStamp=s.dailyStamp??'';energyTs=s.energyTs??Date.now()}}catch(e){}}
let energyTs=Date.now();
function save(){localStorage.setItem('fazendaFelizSave',JSON.stringify({coins,energy,xp,level,land,zonesOwned,plots,animalProducts,dailyStamp,energyTs}))}
function regen(){let n=Math.floor((Date.now()-energyTs)/60000);if(n>0){if(energy<30)energy=Math.min(30,energy+n);energyTs+=n*60000;updateHud()}if(energy>=30)energyTs=Date.now()}
function resize(){let r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);viewW=r.width;viewH=r.height;minS=Math.min(viewW/(WX1-WX0),viewH/(WY1-WY0))*.98;scale=viewH>viewW?Math.max(minS,viewW*1.7/W,viewH*.78/H):Math.max(viewW/W,viewH/H);camX=(viewH>viewW?850:W/2)-viewW/scale/2;camY=(viewH>viewW?560:H/2)-viewH/scale/2;clampCam();worldDraw(performance.now())}

/* terra em volta da fazenda, com árvores e áreas à venda */
const inIsland=(x,y)=>Math.abs(x-768)/790+Math.abs(y-580)/445<1;
const DECOR=(()=>{let r=7,rnd=()=>(r=(r*16807)%2147483647)/2147483647,out=[],kinds=['pine_tree','apple_tree','willow_tree','flower_bush','pine_tree','flower_bush'];
 for(let n=0;n<400&&out.length<46;n++){let x=WX0+rnd()*(WX1-WX0),y=WY0+60+rnd()*(WY1-WY0-60);if(inIsland(x,y+40)||inIsland(x,y-60))continue;
  if(ZONES.some(z=>Math.abs(x-z.x)/(z.n*HX+40)+Math.abs(y-z.y)/(z.n*HY+60)<1.05))continue;if(out.some(o=>Math.hypot(o.x-x,o.y-y)<90))continue;
  let k=kinds[Math.floor(rnd()*kinds.length)];out.push({x,y,k,s:.8+rnd()*.5})}return out.sort((a,b)=>a.y-b.y)})();
const DSZ={pine_tree:[70,66],apple_tree:[190,110],willow_tree:[70,117],flower_bush:[90,40]};
function drawOuter(t,front){
 if(!front){ctx.fillStyle='#86c95a';ctx.fillRect(WX0-200,WY0-200,WX1-WX0+400,WY1-WY0+400);
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=2;for(let k=-40;k<40;k++){ctx.beginPath();ctx.moveTo(WX0+k*104-400,WY0-200);ctx.lineTo(WX0+k*104-400+2400,WY0-200+1385);ctx.stroke();ctx.beginPath();ctx.moveTo(WX0+k*104+2400,WY0-200);ctx.lineTo(WX0+k*104,WY0-200+1385);ctx.stroke()}
  ZONES.forEach(z=>drawZone(z,t))}
 DECOR.forEach(d=>{if((d.y<580)===!front){let [w,h]=DSZ[d.k];drawSprite(d.k,d.x,d.y,w*d.s,h*d.s)}})}
function drawZone(z,t){if(zonesOwned.includes(z.id))return;let n=z.n,P=(a,b)=>[z.x+(a-b)*HX,z.y-n*HY+(a+b)*HY];
 const pl=(pts,f)=>{ctx.beginPath();pts.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill()};
 pl([P(0,0),P(n,0),P(n,n),P(0,n)],'rgba(70,120,40,.35)');
 ctx.save();ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=4;ctx.beginPath();[P(0,0),P(n,0),P(n,n),P(0,n)].forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();ctx.restore();
 [[.25,.3],[.7,.2],[.4,.75],[.8,.7],[.5,.45]].forEach(([a,b],k)=>{let q=P(a*n,b*n);drawSprite(k%2?'flower_bush':'pine_tree',q[0],q[1]+10,k%2?60:48,k%2?27:45)});
 let ok=level>=z.lv,txt=ok?'🔒 '+z.cost+' moedas':'🔒 Nível '+z.lv;ctx.save();ctx.font='900 22px sans-serif';ctx.textAlign='center';let tw=ctx.measureText(txt).width+34,bob=Math.sin(t/400)*3;
 ctx.fillStyle=ok?'#e79a24':'rgba(70,45,20,.85)';ctx.beginPath();ctx.roundRect(z.x-tw/2,z.y-22+bob,tw,40,20);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(txt,z.x,z.y+7+bob);
 ctx.font='bold 15px sans-serif';ctx.fillStyle='rgba(60,40,15,.85)';ctx.fillText(z.nome,z.x,z.y+40+bob);ctx.restore()}
function buyZone(z){if(level<z.lv){toast('Chegue ao nível '+z.lv+' para comprar este terreno');return}if(coins<z.cost){toast('Faltam '+(z.cost-coins)+' moedas para este terreno');return}
 coins-=z.cost;zonesOwned.push(z.id);buildField(plots);gainXP(50);updateHud();save();closePanels&&closePanels();toast(z.nome+' comprado! Nova plantação com '+z.n*z.n+' canteiros 🎉');if(window.SND)SND.play('level')}
function askZone(z){openPanel(z.nome,'<p>Uma nova plantação com <b>'+z.n*z.n+' canteiros</b> para você plantar.</p><p>Preço: <b>'+z.cost+' moedas</b> · precisa do nível '+z.lv+'.</p><button class="panelbtn" onclick="buyZone(ZONES.find(z=>z.id===\''+z.id+'\'))">Comprar terreno</button>')}
function goTo(x,y){camX=x-viewW/scale/2;camY=y-viewH/scale/2;clampCam()}
function drawSprite(key,x,y,w,h){let im=img[key];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x-w/2,y-h,w,h)}
function worldDraw(t){ctx.clearRect(0,0,viewW,viewH);ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);
drawOuter(t,0);if(img.map?.complete)ctx.drawImage(img.map,0,0,W,H);drawOuter(t,1);
// Buildings are separate PNG objects layered over the illustrated terrain.
drawSprite('house',280,430,270,270);drawSprite('barn',1210,360,250,230);drawSprite('silo',1370,310,100,220);drawSprite('windmill',1450,520,170,260);drawSprite('well',330,610,115,160);drawSprite('market',220,610,180,175);
// Extra farm details
if(land>1)drawSprite('apple_tree',410,470,150,170);
// Garden plots and crop stages
{const poly=(pts,f)=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill()};
 fields().forEach(F=>{let n=F.n,ty=F.y-n*HY,P=(a,b)=>[F.x+(a-b)*HX,ty+(a+b)*HY];
 poly([P(0,0),P(n,0),P(n,n),P(0,n)],'#7a4b26');
 poly([P(n,0),P(n,n),[P(n,n)[0],P(n,n)[1]+10],[P(n,0)[0],P(n,0)[1]+10]],'#5b3519');poly([P(0,n),P(n,n),[P(n,n)[0],P(n,n)[1]+10],[P(0,n)[0],P(0,n)[1]+10]],'#6b3f1e');
 plots.forEach(p=>{if(p.f!==F.id)return;let a=p.i,b=p.j,dry=!p.crop;poly([P(a+.06,b+.06),P(a+.94,b+.06),P(a+.94,b+.94),P(a+.06,b+.94)],dry?'#8f5c30':'#6e4322');
  ctx.strokeStyle='rgba(60,32,12,.45)';ctx.lineWidth=2;for(let r=1;r<4;r++){let q1=P(a+.12,b+r*.25),q2=P(a+.88,b+r*.25);ctx.beginPath();ctx.moveTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.stroke()}});
 ctx.strokeStyle='#c98a4a';ctx.lineWidth=5;ctx.beginPath();[P(0,0),P(n,0),P(n,n),P(0,n)].forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke()});
 [...plots].sort((p,q)=>p.y-q.y).forEach(p=>{if(!p.crop)return;let f=(Date.now()-p.planted)/Math.max(1,p.readyAt-p.planted);let st=f>=1?3:f>=.45?2:1;p.stage=st;let sz=st===1?.6:st===2?.8:1;
  let im=img[p.crop+'_'+st];if(im&&im.naturalWidth){let w=72*sz,h=w*im.naturalHeight/im.naturalWidth;let bob=st===3?Math.sin(t/300+p.id)*1.5:0;ctx.drawImage(im,p.x-w/2,p.y+12-h+bob,w,h)}
  if(st===3){ctx.save();ctx.globalAlpha=.5+.4*Math.sin(t/220+p.id);ctx.fillStyle='#fff7b0';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('✦',p.x+16,p.y-28);ctx.restore()}
  else{let bw=38;ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(p.x-bw/2,p.y+14,bw,5);ctx.fillStyle='#ffd34d';ctx.fillRect(p.x-bw/2,p.y+14,bw*Math.min(1,f),5)}});
 floaters=floaters.filter(fl=>(fl.t+=0.016)<1.2);floaters.forEach(fl=>{ctx.save();ctx.globalAlpha=1-fl.t/1.2;ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.fillStyle=fl.neg?'#b3261e':'#2e7d32';ctx.strokeText(fl.txt,fl.x,fl.y-fl.t*40);ctx.fillText(fl.txt,fl.x,fl.y-fl.t*40);ctx.restore()})}
// Pen and wandering animals; animals turn in their travel direction.
drawPens(t);
[...animals].sort((p,q)=>p.y-q.y).forEach(a=>{let im=img[a.type];if(!im?.complete||!im.naturalWidth)return;let w=SZ[a.type]||80,h=w*im.naturalHeight/im.naturalWidth;ctx.save();ctx.translate(a.x,a.y);ctx.fillStyle='rgba(60,35,10,.25)';ctx.beginPath();ctx.ellipse(0,-3,w*.36,w*.1,0,0,7);ctx.fill();let step=a.pause>0?0:Math.abs(Math.sin(t/140+a.x))*-4;ctx.rotate(a.pause>0?0:Math.sin(t/140+a.x)*.04);ctx.scale(a.dx<0?-1:1,1);ctx.drawImage(im,-w/2,-h+step,w,h);ctx.restore()});
if(Date.now()<tractorUntil){let q=(Date.now()-(tractorUntil-4500))/4500;drawSprite('tractor',500+q*420,565,155,145)}else drawSprite('tractor',360,790,125,110);
ctx.restore();}
const SZ={cow:100,pig:80,sheep:78,chicken:48,dog:72};
function pickTarget(a){if(a.type==='dog'){let[b0,b1,b2,b3]=bounds(a);a.tx=b0+Math.random()*(b1-b0);a.ty=b2+Math.random()*(b3-b2);return}
 let q=pin(penOf(a));for(let n=0;n<30;n++){let x=q.x+(Math.random()*2-1)*q.a*.85,y=q.y+(Math.random()*2-1)*q.b*.85;
  if(inPenOf(a,x,y)&&animals.every(o=>o===a||penOf(o)!==penOf(a)||o.tx===undefined||Math.hypot(o.tx-x,(o.ty-y)*1.8)>70)){a.tx=x;a.ty=y;return}}a.tx=q.x;a.ty=q.y}
function bounds(a){return a.type==='dog'?[925,1005,575,640]:[1000,1210,440,575]}
const PENS={cow:{x:1105,y:640,w:430,h:275,nome:'Curral'},sheep:{x:500,y:690,w:255,h:163,nome:'Ovelhas'},pig:{x:1180,y:885,w:290,h:185,nome:'Chiqueiro'},chicken:{x:640,y:455,w:250,h:160,nome:'Galinheiro'}};
function penOf(a){return PENS[a.type]||PENS.cow}
function pin(P){return{x:P.x,y:P.y-P.h*.48,a:P.w*.30,b:P.h*.2}}
function inPenOf(a,x,y){let q=pin(penOf(a));return Math.abs(x-q.x)/q.a+Math.abs(y-q.y)/q.b<=1}
function inPen(x,y){return true}
function drawPens(t){for(const k in PENS){const P=PENS[k],q=pin(P);
 drawSprite('pen',P.x,P.y,P.w,P.h);
 if(k==='pig'){ctx.fillStyle='#7a5230';ctx.beginPath();ctx.ellipse(q.x+10,q.y+4,q.a*.5,q.b*.45,0,0,7);ctx.fill();ctx.fillStyle='#8f6640';ctx.beginPath();ctx.ellipse(q.x+4,q.y+1,q.a*.34,q.b*.28,0,0,7);ctx.fill()}
 if(k==='chicken'){ctx.fillStyle='#e8cf7a';ctx.beginPath();ctx.ellipse(q.x+25,q.y+6,q.a*.4,q.b*.38,0,0,7);ctx.fill()}

 if(k==='chicken')drawSprite('barn',q.x-q.a*.45,q.y-q.b*.1,82,78);
 if(k==='pig')drawSprite('barrel',q.x+q.a*.55,q.y-q.b*.25,30,38);
 if(k==='cow'){drawSprite('crate',q.x-q.a*.6,q.y-q.b*.2,48,44)}
 if(k==='sheep')drawSprite('barrel',q.x+q.a*.6,q.y-q.b*.3,28,36);
 if(scale>.5){ctx.save();ctx.font='bold 15px sans-serif';ctx.textAlign='center';let tw=ctx.measureText(P.nome).width+18,lx=P.x,ly=P.y-P.h-4;ctx.fillStyle='rgba(90,52,16,.88)';ctx.beginPath();ctx.roundRect(lx-tw/2,ly-18,tw,24,12);ctx.fill();ctx.fillStyle='#fff3c4';ctx.fillText(P.nome,lx,ly-1);ctx.restore()}}}
function tick(ts){let dt=Math.min((ts-last)/1000,.05)||0;last=ts;animals.forEach((a,k)=>{

function clampCam(){let ww=WX1-WX0,wh=WY1-WY0;if(ww*scale<=viewW)camX=WX0+(ww-viewW/scale)/2;else camX=Math.max(WX0,Math.min(WX1-viewW/scale,camX));if(wh*scale<=viewH)camY=WY0+(wh-viewH/scale)/2;else camY=Math.max(WY0,Math.min(WY1-viewH/scale,camY))}
function zoomBy(f){let cx=camX+viewW/scale/2,cy=camY+viewH/scale/2;scale=Math.max(minS,Math.min(2.2,scale*f));camX=cx-viewW/scale/2;camY=cy-viewH/scale/2;clampCam()}

  start(){init();if(!ac)return;if(ac.state==='suspended')ac.resume();if(!started){started=true;startMusic()}},
