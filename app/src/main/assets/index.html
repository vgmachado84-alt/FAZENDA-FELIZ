<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fazenda Feliz</title>
<style>
:root{--green:#3b9d46;--deep:#236b35;--gold:#ffca3a;--cream:#fff7df;--brown:#8b542b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7fbd52;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;color:#fff}
#game{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#8bd8f4,#a9db72)}
#top{z-index:5;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:env(safe-area-inset-top) 8px 7px;background:linear-gradient(#2f9145,#216c38);box-shadow:0 3px 7px #174b3488;min-height:58px}
.brand{font-weight:1000;font-size:clamp(14px,3.4vw,21px);color:#fff4b0;text-shadow:1px 2px #70451d;white-space:nowrap}.stats{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.stat{background:#164f31;border:1px solid #9cdb75;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}.stat b{color:#ffe37b}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#9ddc6a}canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff9;border:1px solid #fff;border-radius:20px;padding:5px 12px;color:#315b30;font-size:11px;font-weight:800;pointer-events:none;white-space:nowrap;text-shadow:none}
#bottom{z-index:5;background:linear-gradient(#fff4d3,#e6c68c);padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:space-around;box-shadow:0 -3px 8px #63401b55}
.action{border:2px solid #b87932;border-radius:14px;background:linear-gradient(#fff,#f6d99b);color:#603c1c;min-width:0;flex:1;padding:6px 3px;font-weight:900;font-size:11px;box-shadow:0 3px #a86a2a;display:flex;flex-direction:column;align-items:center;gap:2px}
.action:active{transform:translateY(2px);box-shadow:0 1px #a86a2a}.action small{font-size:9px;font-weight:700;color:#76502b}.action.selected{background:linear-gradient(#fff6a9,#ffcf4a);border-color:#e39b19}
#toast{position:absolute;z-index:20;left:50%;bottom:90px;transform:translateX(-50%);background:#254d2b;color:white;padding:9px 16px;border-radius:20px;font-weight:800;font-size:13px;box-shadow:0 3px 10px #0005;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#panel{position:absolute;z-index:15;inset:12% 6% 12%;background:linear-gradient(#fff9e8,#f0d49c);border:4px solid #a86a2a;border-radius:22px;box-shadow:0 10px 40px #173b2788;color:#57371c;display:none;overflow:auto;padding:15px}#panel h2{margin:0 0 10px;color:#367b3c}#panel p{font-size:13px}#panel .close{float:right;border:0;border-radius:50%;width:32px;height:32px;background:#b84a35;color:white;font-size:18px;font-weight:900} .shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.shopitem{background:#fff8e7;border:2px solid #d7a75f;border-radius:14px;padding:9px;text-align:center}.shopitem img{width:90px;height:70px;object-fit:contain}.shopitem strong{display:block}.shopitem button,.panelbtn{border:0;border-radius:12px;background:#3c9b4b;color:white;padding:8px 12px;font-weight:900;margin-top:5px}.mission{background:#fff8e7;border-radius:12px;padding:10px;margin:7px 0;border:1px solid #ddb36e}
@media(orientation:landscape){#top{min-height:48px}.stat{font-size:11px;padding:3px 7px}#bottom{padding-top:4px;padding-bottom:4px}.action{padding:3px;font-size:10px;flex-direction:row;justify-content:center}.action small{display:none}#panel{inset:8% 20%}}
</style></head>
<body><div id="game">
<header id="top"><div class="brand">FAZENDA FELIZ</div><div class="stats"><div class="stat">NÍVEL <b id="level">1</b></div><div class="stat">MOEDAS <b id="coins">250</b></div><div class="stat">ENERGIA <b id="energy">30</b></div><div class="stat">XP <b id="xp">0</b></div></div></header>
<main id="scene"><canvas id="world"></canvas><div id="hint">Arraste para explorar · toque nos canteiros e animais</div><div id="toast"></div><section id="panel"></section></main>
<nav id="bottom">
<button class="action selected" id="plantBtn" onclick="choosePlant('wheat')"><span>Plantar</span><small>Trigo</small></button>
<button class="action" onclick="openShop()">Loja<small>sementes</small></button>
<button class="action" onclick="useTractor()">Trator<small>colher tudo</small></button>
<button class="action" onclick="openMissions()">Missões<small>objetivos</small></button>
<button class="action" onclick="dailyGift()">Presente<small>diário</small></button>
<button class="action" onclick="expandLand()">Terreno<small>expandir</small></button>
</nav></div>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const names=['map','house','barn','silo','windmill','well','market','tractor','cow','pig','sheep','chicken','dog','pen','empty_plot','wheat_1','wheat_2','wheat_3','corn_1','corn_2','corn_3','carrot_1','carrot_2','carrot_3','strawberry_1','strawberry_2','strawberry_3','lettuce_1','lettuce_2','lettuce_3','apple_tree','flower_bush','pine_tree','willow_tree','gate','cart','crate','barrel'];
const img={};names.forEach(n=>{img[n]=new Image();img[n].src='images/'+n+'.png'});
const W=1536,H=1024;let scale=1,camX=0,camY=0,viewW=0,viewH=0,last=0,selectedCrop='wheat',coins=250,energy=30,xp=0,level=1,land=1,animalProducts={cow:0,pig:0,sheep:0,chicken:0},dailyStamp='',tractorUntil=0;
const FX=700,FY=625,HX=52,HY=30;let fieldN=4;let plots=[];
function fieldSize(l){return Math.min(5,3+l)}
function buildField(old){fieldN=fieldSize(land);let np=[];for(let i=0;i<fieldN;i++)for(let j=0;j<fieldN;j++){let c=cellCenter(i,j);np.push({i,j,x:c.x,y:c.y,crop:null,stage:0,planted:0,readyAt:0,id:np.length})}
 (old||[]).forEach((p,k)=>{if(p&&p.crop&&np[k]){np[k].crop=p.crop;np[k].planted=p.planted;np[k].readyAt=p.readyAt}});plots=np}
function cellCenter(i,j){let ty=FY-fieldN*HY;return{x:FX+(i-j)*HX,y:ty+(i+j+1)*HY}}
function cellAt(x,y){let u=(x-FX)/HX,v=(y-(FY-fieldN*HY))/HY,i=Math.floor((v+u)/2),j=Math.floor((v-u)/2);if(i<0||j<0||i>=fieldN||j>=fieldN)return null;return plots[i*fieldN+j]}
buildField();
let animals=[{type:'cow',x:1040,y:560,dx:1,dy:0.2,product:'Leite'},{type:'pig',x:1140,y:590,dx:-.6,dy:.5,product:''},{type:'sheep',x:1200,y:540,dx:.3,dy:-.7,product:'Lã'},{type:'chicken',x:1090,y:620,dx:.8,dy:-.3,product:'Ovos'},{type:'dog',x:930,y:640,dx:-.5,dy:-.2,product:''}];
function load(){try{let s=JSON.parse(localStorage.getItem('fazendaFelizSave')||'null');if(s){coins=s.coins??coins;energy=s.energy??energy;xp=s.xp??xp;level=s.level??level;land=s.land??land;buildField(s.plots||[]);animalProducts=s.animalProducts??animalProducts;dailyStamp=s.dailyStamp??''}}catch(e){}}
function save(){localStorage.setItem('fazendaFelizSave',JSON.stringify({coins,energy,xp,level,land,plots,animalProducts,dailyStamp}))}
function resize(){let r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);viewW=r.width;viewH=r.height;minS=Math.min(viewW/W,viewH/H)*.98;scale=viewH>viewW?Math.max(minS,viewW*1.7/W):Math.max(viewW/W,viewH/H);camX=(W-viewW/scale)/2;camY=(H-viewH/scale)/2;clampCam();worldDraw(performance.now())}
function drawSprite(key,x,y,w,h){let im=img[key];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x-w/2,y-h,w,h)}
function worldDraw(t){ctx.clearRect(0,0,viewW,viewH);ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);
if(img.map?.complete)ctx.drawImage(img.map,0,0,W,H);
// Buildings are separate PNG objects layered over the illustrated terrain.
drawSprite('house',280,430,270,270);drawSprite('barn',1210,360,250,230);drawSprite('silo',1370,310,100,220);drawSprite('windmill',1450,520,170,260);drawSprite('well',330,610,115,160);drawSprite('market',220,610,180,175);
// Extra farm details
if(land>1)drawSprite('apple_tree',410,470,150,170);
// Garden plots and crop stages
{let ty=FY-fieldN*HY,P=(a,b)=>[FX+(a-b)*HX,ty+(a+b)*HY];
 const poly=(pts,f)=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill()};
 let n=fieldN;poly([P(0,0),P(n,0),P(n,n),P(0,n)],'#7a4b26');
 poly([P(n,0),P(n,n),[P(n,n)[0],P(n,n)[1]+10],[P(n,0)[0],P(n,0)[1]+10]],'#5b3519');poly([P(0,n),P(n,n),[P(n,n)[0],P(n,n)[1]+10],[P(0,n)[0],P(0,n)[1]+10]],'#6b3f1e');
 plots.forEach(p=>{let a=p.i,b=p.j,dry=!p.crop;poly([P(a+.06,b+.06),P(a+.94,b+.06),P(a+.94,b+.94),P(a+.06,b+.94)],dry?'#8f5c30':'#6e4322');
  ctx.strokeStyle='rgba(60,32,12,.45)';ctx.lineWidth=2;for(let r=1;r<4;r++){let q1=P(a+.12,b+r*.25),q2=P(a+.88,b+r*.25);ctx.beginPath();ctx.moveTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.stroke()}});
 ctx.strokeStyle='#c98a4a';ctx.lineWidth=5;ctx.beginPath();[P(0,0),P(n,0),P(n,n),P(0,n)].forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();
 [...plots].sort((p,q)=>(p.i+p.j)-(q.i+q.j)).forEach(p=>{if(!p.crop)return;let f=(Date.now()-p.planted)/Math.max(1,p.readyAt-p.planted);let st=f>=1?3:f>=.45?2:1;p.stage=st;let sz=st===1?.6:st===2?.8:1;
  let im=img[p.crop+'_'+st];if(im&&im.naturalWidth){let w=72*sz,h=w*im.naturalHeight/im.naturalWidth;let bob=st===3?Math.sin(t/300+p.id)*1.5:0;ctx.drawImage(im,p.x-w/2,p.y+12-h+bob,w,h)}
  if(st===3){ctx.save();ctx.globalAlpha=.5+.4*Math.sin(t/220+p.id);ctx.fillStyle='#fff7b0';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('✦',p.x+16,p.y-28);ctx.restore()}
  else{let bw=38;ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(p.x-bw/2,p.y+14,bw,5);ctx.fillStyle='#ffd34d';ctx.fillRect(p.x-bw/2,p.y+14,bw*Math.min(1,f),5)}});
 floaters=floaters.filter(fl=>(fl.t+=0.016)<1.2);floaters.forEach(fl=>{ctx.save();ctx.globalAlpha=1-fl.t/1.2;ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.fillStyle=fl.neg?'#b3261e':'#2e7d32';ctx.strokeText(fl.txt,fl.x,fl.y-fl.t*40);ctx.fillText(fl.txt,fl.x,fl.y-fl.t*40);ctx.restore()})}
// Pen and wandering animals; animals turn in their travel direction.
drawSprite('pen',1105,640,470,300);
[...animals].sort((p,q)=>p.y-q.y).forEach(a=>{let im=img[a.type];if(!im?.complete||!im.naturalWidth)return;let w=SZ[a.type]||80,h=w*im.naturalHeight/im.naturalWidth;ctx.save();ctx.translate(a.x,a.y);ctx.fillStyle='rgba(60,35,10,.25)';ctx.beginPath();ctx.ellipse(0,-3,w*.36,w*.1,0,0,7);ctx.fill();let step=a.pause>0?0:Math.abs(Math.sin(t/140+a.x))*-4;ctx.rotate(a.pause>0?0:Math.sin(t/140+a.x)*.04);ctx.scale(a.dx<0?-1:1,1);ctx.drawImage(im,-w/2,-h+step,w,h);ctx.restore()});
if(Date.now()<tractorUntil){let q=(Date.now()-(tractorUntil-4500))/4500;drawSprite('tractor',500+q*420,565,155,145)}else drawSprite('tractor',360,790,125,110);
ctx.restore();}
const SZ={cow:125,pig:100,sheep:95,chicken:58,dog:78};
function bounds(a){return a.type==='dog'?[860,990,560,700]:[975,1235,520,640]}
function tick(ts){let dt=Math.min((ts-last)/1000,.05)||0;last=ts;animals.forEach(a=>{if(a.pause>0){a.pause-=dt;return}if(Math.random()<dt*.25){a.pause=1+Math.random()*2.5;a.dx=(Math.random()-.5)*2;a.dy=(Math.random()-.5)*1.2;return}let sp=a.type==='chicken'?34:26;a.x+=a.dx*dt*sp;a.y+=a.dy*dt*sp;let[b0,b1,b2,b3]=bounds(a);if(a.x<b0||a.x>b1){a.dx*=-1;a.x=Math.max(b0,Math.min(b1,a.x))}if(a.y<b2||a.y>b3){a.dy*=-1;a.y=Math.max(b2,Math.min(b3,a.y))}});worldDraw(ts);requestAnimationFrame(tick)}
function updateHud(){document.getElementById('coins').textContent=coins;document.getElementById('energy').textContent=energy;document.getElementById('xp').textContent=xp;document.getElementById('level').textContent=level}
function gainXP(n){xp+=n;while(xp>=level*100){xp-=level*100;level++;coins+=50;toast('Subiu para o nível '+level+'! +50 moedas')}updateHud();save()}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.opacity=0,1900)}
function choosePlant(c){selectedCrop=c;document.querySelectorAll('.action').forEach(x=>x.classList.remove('selected'));document.getElementById('plantBtn').classList.add('selected');toast('Semente selecionada: '+({wheat:'trigo',corn:'milho',carrot:'cenoura',strawberry:'morango',lettuce:'alface'}[c]))}
function plantAt(p,quiet){if(p.crop&&Date.now()>=p.readyAt){let value={wheat:18,corn:24,carrot:30,strawberry:38,lettuce:32}[p.crop];coins+=value;energy=Math.min(30,energy+1);gainXP(12);p.crop=null;floaters.push({x:p.x,y:p.y-30,txt:'+'+value,t:0});if(!quiet)toast('Colheita realizada! +'+value+' moedas');updateHud();save();return}if(p.crop){if(!quiet)toast('A plantação ainda está crescendo');return}if(energy<1){toast('Sem energia. Aguarde ou receba o presente diário.');return}let cost={wheat:3,corn:5,carrot:6,strawberry:8,lettuce:7}[selectedCrop];if(coins<cost){toast('Moedas insuficientes');return}coins-=cost;floaters.push({x:p.x,y:p.y-30,txt:'-'+cost,t:0,neg:1});energy--;p.crop=selectedCrop;p.planted=Date.now();p.readyAt=Date.now()+({wheat:35000,corn:50000,carrot:60000,strawberry:75000,lettuce:65000}[selectedCrop]);p.stage=1;updateHud();save();if(!quiet)toast('Semente plantada! Dica: arraste o dedo pela plantação para plantar vários.');}
let floaters=[];
function collectAnimal(a){let key=a.type;if(!a.product){toast('O '+(key==='dog'?'cachorro':'porquinho')+' está feliz!');gainXP(2);return}if((animalProducts[key]||0)>=1){toast('Este animal já entregou '+a.product.toLowerCase()+' hoje');return}animalProducts[key]=1;let reward=key==='cow'?28:key==='chicken'?20:25;coins+=reward;gainXP(8);toast(a.product+' recebido! +'+reward+' moedas');updateHud();save()}
function hit(x,y){let c=cellAt(x,y);if(c){plantAt(c);return true}for(let a of animals){if(Math.abs(x-a.x)<(SZ[a.type]||80)*.55&&Math.abs(y-(a.y-(SZ[a.type]||80)*.4))<(SZ[a.type]||80)*.5){collectAnimal(a);return true}}return false}
let pointers=new Map(),drag=null,pinch=null,minS=.3;
function toWorld(cx,cy){let r=canvas.getBoundingClientRect();return {x:(cx-r.left)/scale+camX,y:(cy-r.top)/scale+camY}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={id:e.pointerId,x:e.clientX,y:e.clientY,camX,camY,moved:false};let w=toWorld(e.clientX,e.clientY),c=cellAt(w.x,w.y);if(c){drag.paint=new Set([c.id]);drag.first=c}}if(pointers.size===2){let a=[...pointers.values()];pinch={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale,midX:(a[0].x+a[1].x)/2,midY:(a[0].y+a[1].y)/2};drag=null}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),ns=Math.max(minS,Math.min(2.2,pinch.scale*d/pinch.dist));let mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,r=canvas.getBoundingClientRect();let wx=(pinch.midX-r.left)/scale+camX,wy=(pinch.midY-r.top)/scale+camY;scale=ns;camX=wx-(mx-r.left)/scale;camY=wy-(my-r.top)/scale;clampCam();return}if(drag&&drag.id===e.pointerId&&drag.paint){let w=toWorld(e.clientX,e.clientY),c=cellAt(w.x,w.y);if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>6){if(!drag.moved){drag.moved=true;plantAt(drag.first,true)}if(c&&!drag.paint.has(c.id)){drag.paint.add(c.id);plantAt(c,true)}}return}if(drag&&drag.id===e.pointerId){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;camX=drag.camX-dx/scale;camY=drag.camY-dy/scale;clampCam()}});
function clampCam(){if(W*scale<=viewW)camX=(W-viewW/scale)/2;else camX=Math.max(-30,Math.min(W-viewW/scale+30,camX));if(H*scale<=viewH)camY=(H-viewH/scale)/2;else camY=Math.max(-30,Math.min(H-viewH/scale+30,camY))}
function zoomBy(f){let cx=camX+viewW/scale/2,cy=camY+viewH/scale/2;scale=Math.max(minS,Math.min(2.2,scale*f));camX=cx-viewW/scale/2;camY=cy-viewH/scale/2;clampCam()}
function zoomReset(){resize()}
canvas.addEventListener('pointerup',e=>{let p=pointers.get(e.pointerId);if(pointers.size===1&&drag&&!drag.moved){let w=toWorld(e.clientX,e.clientY);if(!hit(w.x,w.y)){} }pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(pointers.size===0)drag=null});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=null});
function useTractor(){let ready=plots.filter(p=>p.crop&&Date.now()>=p.readyAt);if(!ready.length){toast('Ainda não há plantações prontas');return}if(energy<2){toast('O trator precisa de 2 energias');return}energy-=2;tractorUntil=Date.now()+4500;setTimeout(()=>{ready.forEach(p=>{coins+=({wheat:18,corn:24,carrot:30,strawberry:38,lettuce:32}[p.crop]);p.crop=null;gainXP(10)});updateHud();save();toast('Trator colheu '+ready.length+' canteiro(s)!')},4500);updateHud();save()}
function openPanel(title,body){let p=document.getElementById('panel');p.innerHTML='<button class="close" onclick="closePanels()">×</button><h2>'+title+'</h2>'+body;p.style.display='block'}function closePanels(){document.getElementById('panel').style.display='none'}
function openShop(){let crops=[['wheat','Trigo',3],['corn','Milho',5],['carrot','Cenoura',6],['strawberry','Morango',8],['lettuce','Alface',7]];let html=`<p>Escolha uma semente para plantar. O tempo de crescimento é curto nesta versão de demonstração.</p><div class="shopgrid">${crops.map(([k,n,c])=>`<div class="shopitem"><img src="images/${k}_3.png"><strong>${n}</strong><span>${c} moedas</span><br><button onclick="buySeed('${k}')">Selecionar</button></div>`).join('')}</div><hr><div class="shopgrid"><div class="shopitem"><img src="images/cow.png"><strong>Vaca</strong><button onclick="buyAnimal('cow')">Comprar 120</button></div><div class="shopitem"><img src="images/chicken.png"><strong>Galinha</strong><button onclick="buyAnimal('chicken')">Comprar 65</button></div></div>`;openPanel('Loja da fazenda',html)}
function buySeed(k){choosePlant(k);closePanels()}function buyAnimal(k){let c=k==='cow'?120:65;if(coins<c){toast('Moedas insuficientes');return}coins-=c;animals.push({type:k,x:1040+Math.random()*150,y:540+Math.random()*80,dx:Math.random()>.5?1:-1,dy:.4,product:k==='cow'?'Leite':'Ovos'});animalProducts[k]=0;updateHud();save();toast('Animal comprado!');closePanels()}
function openMissions(){openPanel('Missões da fazenda','<div class="mission"><b>Primeira colheita</b><p>Colha 3 canteiros para ganhar 80 moedas e 30 XP.</p><button class="panelbtn" onclick="claimMission(3)">Resgatar recompensa</button></div><div class="mission"><b>Cuide dos animais</b><p>Recolha leite, ovos ou lã.</p><button class="panelbtn" onclick="claimMission(2)">Resgatar 40 moedas</button></div><div class="mission"><b>Pequena expansão</b><p>Abra mais espaço para sua fazenda.</p><button class="panelbtn" onclick="expandLand();closePanels()">Expandir terreno</button></div>')}
function claimMission(n){coins+=n===3?80:40;gainXP(30);updateHud();save();toast('Missão concluída! Recompensa recebida.');closePanels()}
function dailyGift(){let today=new Date().toISOString().slice(0,10);if(dailyStamp===today){toast('O presente de hoje já foi recebido');return}dailyStamp=today;coins+=100;energy=Math.min(30,energy+10);gainXP(15);updateHud();save();toast('Presente diário: 100 moedas e 10 energias!')}
