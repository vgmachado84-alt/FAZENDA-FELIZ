name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FazendaFeliz.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: FazendaFeliz-apk
          path: FazendaFeliz.apk

      - name: Publicar APK para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fazenda Feliz (versão ${{ github.run_number }})
          prerelease: true
          files: FazendaFeliz.apk
          body: |
            Toque em **FazendaFeliz.apk** abaixo para baixar e instalar no celular.
            Se o Android pedir, permita instalar apps desta fonte.
